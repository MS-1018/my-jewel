<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jewel Survival - Sound Evolution</title>
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: none; box-sizing: border-box; }
        body { 
            text-align: center; background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%); 
            color: white; font-family: 'Arial Black', sans-serif; margin: 0; overflow: hidden; 
            position: fixed; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        #game-container { display: flex; flex-direction: column; align-items: center; width: 320px; }
        #score-box { font-size: 32px; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); margin-bottom: 5px; }
        #timer-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; margin-bottom: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        #timer-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00d2ff, #92fe9d); transition: width 0.1s linear; }
        #board { position: relative; width: 320px; height: 320px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .gem { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; z-index: 2; transition: left 0.2s linear, top 0.2s linear, transform 0.2s linear; }
        .gem-inner { width: 36px; height: 36px; border-radius: 10px; position: relative; box-shadow: inset -4px -4px 6px rgba(0,0,0,0.4), inset 4px 4px 6px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3); }
        .is-bomb .gem-inner { border: 3px solid #fff; box-shadow: 0 0 15px #fff, 0 0 20px #ffd700; animation: bombRotate 2s linear infinite; }
        @keyframes bombRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .gem-inner::after { content: ''; position: absolute; top: 15%; left: 15%; width: 35%; height: 20%; background: rgba(255, 255, 255, 0.4); border-radius: 50%; transform: rotate(-30deg); }
        .c0 { background: radial-gradient(circle at 30% 30%, #ff5f6d, #ff2a2a); }
        .c1 { background: radial-gradient(circle at 30% 30%, #ffdb01, #e17009); }
        .c2 { background: radial-gradient(circle at 30% 30%, #00d2ff, #3a7bd5); }
        .c3 { background: radial-gradient(circle at 30% 30%, #92fe9d, #00c9ff); }
        .c4 { background: radial-gradient(circle at 30% 30%, #ee9ca7, #ff29bd); }
        .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 10; }
        .combo-text { position: absolute; width: 100%; text-align: center; font-size: 42px; color: #fff; text-shadow: 0 0 15px #ff00de, 0 0 5px #000; font-style: italic; pointer-events: none; z-index: 20; animation: comboPop 0.6s ease-out forwards; }
        @keyframes comboPop { 0% { transform: scale(0.5); opacity: 0; } 20% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1.2) translateY(-40px); opacity: 0; } }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #startBtn { padding: 15px 50px; border-radius: 40px; border: none; background: #fff; color: #000; font-weight: bold; font-size: 24px; box-shadow: 0 0 20px rgba(255,255,255,0.4); cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-box">SCORE: <span id="score">0</span></div>
        <div id="timer-container"><div id="timer-bar"></div></div>
        <div id="board"></div>
        <div id="overlay">
            <h1 id="status-text" style="color:#00d2ff; font-size: 40px;">Jewel Survival</h1>
            <div id="result-content" style="display:none; margin-bottom: 20px;">
                <p>FINAL SCORE: <span id="final-score-display" style="font-size: 48px;">0</span></p>
                <p style="color:#ffd700;">🏆 BEST: <span id="best-score-display">0</span></p>
            </div>
            <button id="startBtn">START</button>
        </div>
    </div>

<script>
    const ROWS = 8, COLS = 8, SIZE = 40;
    let board = [], score = 0, isAnimating = false, isGameOver = true, timeLeft = 100;
    let touchStart = null, timerInterval = null, audioCtx, masterGain, compressor, comboCount = 0;
    
    const boardEl = document.getElementById('board'), timerBar = document.getElementById('timer-bar');
    const overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn');

    function initAudio() {
        if(audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-15, audioCtx.currentTime);
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        compressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);
    }

    // ★進化したサウンド再生ロジック
    function playEffect(type, delay = 0) {
        if(!audioCtx) return;
        const now = audioCtx.currentTime + delay;
        
        if(type === 'normal') { // ポッ
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(880, now);
            o.frequency.exponentialRampToValueAtTime(440, now + 0.1);
            g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0, now + 0.1);
            o.connect(g); g.connect(compressor);
            o.start(now); o.stop(now + 0.1);
        } else if(type === 'combo') { // ポン！
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(400 + (comboCount * 60), now);
            o.frequency.exponentialRampToValueAtTime(200, now + 0.2);
            g.gain.setValueAtTime(0.4, now); g.gain.linearRampToValueAtTime(0, now + 0.2);
            o.connect(g); g.connect(compressor);
            o.start(now); o.stop(now + 0.2);
        } else if(type === 'bomb') { // パーン！
            // 爆発音用にノイズを生成
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioCtx.createBufferSource(), g = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, now);
            noise.buffer = buffer;
            g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            noise.connect(filter); filter.connect(g); g.connect(compressor);
            noise.start(now); noise.stop(now + 0.3);
            
            // 低音の補強
            const o = audioCtx.createOscillator();
            o.type = 'sine'; o.frequency.setValueAtTime(100, now);
            o.frequency.exponentialRampToValueAtTime(40, now + 0.2);
            o.connect(g); o.start(now); o.stop(now + 0.3);
        }
    }

    function showComboEffect(count) {
        if(count < 2) return;
        const div = document.createElement('div');
        div.className = 'combo-text'; div.innerText = count + " Combo!!";
        div.style.top = "120px";
        boardEl.appendChild(div);
        setTimeout(() => div.remove(), 600);
        playEffect('combo');
    }

    function createParticles(x, y, colorClass, count=12) {
        const pRef = document.querySelector('.' + colorClass);
        const gemColor = pRef ? getComputedStyle(pRef).backgroundColor : "#fff";
        for(let i=0; i<count; i++) {
            const p = document.createElement('div');
            p.className = 'particle'; p.style.backgroundColor = gemColor;
            p.style.left = (x + 20) + 'px'; p.style.top = (y + 20) + 'px';
            boardEl.appendChild(p);
            const angle = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6;
            const vx = Math.cos(angle) * v, vy = Math.sin(angle) * v;
            let op = 1;
            const animateP = () => {
                const curX = parseFloat(p.style.left) + vx, curY = parseFloat(p.style.top) + vy;
                op -= 0.03; p.style.left = curX + 'px'; p.style.top = curY + 'px'; p.style.opacity = op;
                if(op > 0) requestAnimationFrame(animateP); else p.remove();
            };
            requestAnimationFrame(animateP);
        }
    }

    startBtn.onclick = (e) => { e.preventDefault(); initAudio(); audioCtx.resume(); resetGame(); };

    function resetGame() {
        isGameOver = false; isAnimating = false; score = 0; timeLeft = 100; comboCount = 0;
        overlay.style.display = 'none'; document.getElementById('score').innerText = score;
        boardEl.innerHTML = ''; board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
        for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) board[r][c] = { color: Math.floor(Math.random()*5), el: null, isBomb: false };
        draw(); 
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => { if(!isGameOver) { timeLeft -= 0.45; if(timeLeft <= 0) gameOver(); timerBar.style.width = timeLeft + '%'; } }, 100);
    }

    function draw() {
        for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) {
            let d = board[r][c]; if(!d) continue;
            if(!d.el) {
                d.el = document.createElement('div'); d.el.className = 'gem' + (d.isBomb ? ' is-bomb' : '');
                d.el.innerHTML = `<div class="gem-inner c${d.color}"></div>`;
                boardEl.appendChild(d.el); d.el.style.left = (c * SIZE) + 'px'; d.el.style.top = '-40px'; d.el.style.transform = 'scale(0)';
            }
            if(d.isBomb && !d.el.classList.contains('is-bomb')) d.el.classList.add('is-bomb');
            const targetTop = (r * SIZE) + 'px', targetLeft = (c * SIZE) + 'px';
            setTimeout(() => { if(d.el) { d.el.style.left = targetLeft; d.el.style.top = targetTop; d.el.style.transform = 'scale(1)'; } }, 10);
        }
    }

    function swap(r1, c1, r2, c2) {
        isAnimating = true; comboCount = 0;
        let t1 = board[r1][c1], t2 = board[r2][c2];
        board[r1][c1] = t2; board[r2][c2] = t1; draw();
        setTimeout(() => { if(!checkAndClear()) { board[r1][c1] = t1; board[r2][c2] = t2; draw(); setTimeout(() => isAnimating = false, 200); } }, 200);
    }

    function checkAndClear() {
        let m = Array.from({length: ROWS}, () => Array(COLS).fill(false)), found = false;
        let bombCandidates = [];

        for(let r=0; r<ROWS; r++) {
            let len = 1;
            for(let c=0; c<COLS; c++) {
                if(c < COLS-1 && board[r][c] && board[r][c+1] && board[r][c].color === board[r][c+1].color) len++;
                else {
                    if(len >= 3) { found = true; const col = board[r][c].color; for(let i=0; i<len; i++) m[r][c-i] = true; if(len >= 4) bombCandidates.push({r, c: c-Math.floor(len/2), color: col}); }
                    len = 1;
                }
            }
        }
        for(let c=0; c<COLS; c++) {
            let len = 1;
            for(let r=0; r<ROWS; r++) {
                if(r < ROWS-1 && board[r][c] && board[r+1][c] && board[r][c].color === board[r+1][c].color) len++;
                else {
                    if(len >= 3) { found = true; const col = board[r][c].color; for(let i=0; i<len; i++) m[r-i][c] = true; if(len >= 4) bombCandidates.push({r: r-Math.floor(len/2), c, color: col}); }
                    len = 1;
                }
            }
        }
        for(let r=0; r<ROWS-1; r++) {
            for(let c=0; c<COLS-1; c++) {
                const b1 = board[r][c], b2 = board[r+1][c], b3 = board[r][c+1], b4 = board[r+1][c+1];
                if(b1 && b2 && b3 && b4 && b1.color === b2.color && b1.color === b3.color && b1.color === b4.color) {
                    m[r][c] = m[r+1][c] = m[r][c+1] = m[r+1][c+1] = true; if(!found) bombCandidates.push({r, c, color: b1.color}); found = true;
                }
            }
        }

        if(found) {
            comboCount++;
            if (comboCount === 1) playEffect('normal'); else showComboEffect(comboCount);

            let totalClearMask = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            let queue = [];
            for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) { if(m[r][c]) { totalClearMask[r][c] = true; if(board[r][c] && board[r][c].isBomb) queue.push({r, c}); } }

            let head = 0;
            while(head < queue.length) {
                const {r, c} = queue[head++];
                playEffect('bomb', head * 0.08); // ボムの音！
                for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) {
                    let nr=r+dr, nc=c+dc;
                    if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS && !totalClearMask[nr][nc]) {
                        totalClearMask[nr][nc] = true; if(board[nr][nc] && board[nr][nc].isBomb) queue.push({r: nr, c: nc});
                    }
                }
            }

            let clearedCount = 0;
            for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) {
                if(totalClearMask[r][c] && board[r][c]) {
                    createParticles(c*SIZE, r*SIZE, 'c'+board[r][c].color, 12);
                    const el = board[r][c].el; el.style.transform = 'scale(0)'; setTimeout(() => el.remove(), 200);
                    board[r][c] = null; clearedCount++;
                }
            }

            bombCandidates.forEach(pos => { if(!board[pos.r][pos.c]) board[pos.r][pos.c] = { color: pos.color, el: null, isBomb: true }; });
            score += clearedCount * 10 * comboCount; timeLeft = Math.min(100, timeLeft + (clearedCount * 0.8));
            document.getElementById('score').innerText = score; setTimeout(applyGravity, 200);
        } else isAnimating = false;
        return found;
    }

    function applyGravity() {
        for(let c=0; c<COLS; c++) {
            let empty = 0;
            for(let r=ROWS-1; r>=0; r--) { if(!board[r][c]) empty++; else if(empty > 0) { board[r+empty][c] = board[r][c]; board[r][c] = null; } }
            for(let i=0; i<empty; i++) board[i][c] = { color: Math.floor(Math.random()*5), el: null, isBomb: false };
        }
        draw(); setTimeout(checkAndClear, 250);
    }

    function gameOver() {
        isGameOver = true; clearInterval(timerInterval);
        let hi = localStorage.getItem('jewelHi') || 0; if(score > hi) { hi = score; localStorage.setItem('jewelHi', hi); }
        document.getElementById('status-text').innerText = "TIME UP!";
        document.getElementById('final-score-display').innerText = score;
        document.getElementById('best-score-display').innerText = hi;
        document.getElementById('result-content').style.display = 'block';
        overlay.style.display = 'flex';
        playEffect('normal'); // 最後に一発
    }

    const getPos = (e) => {
        const t = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
        const rect = boardEl.getBoundingClientRect();
        return { x: t.clientX, y: t.clientY, r: Math.floor((t.clientY - rect.top) / SIZE), c: Math.floor((t.clientX - rect.left) / SIZE) };
    };

    boardEl.addEventListener('touchstart', (e) => { if(isAnimating || isGameOver) return; if(e.cancelable) e.preventDefault(); const p = getPos(e); if(p.r>=0 && p.r<ROWS && p.c>=0 && p.c<COLS) touchStart = p; }, {passive: false});
    boardEl.addEventListener('touchend', (e) => {
        if(!touchStart || isAnimating) { touchStart = null; return; }
        const t = e.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
        if(Math.abs(dx)>15 || Math.abs(dy)>15) {
            let tr=touchStart.r, tc=touchStart.c; if(Math.abs(dx)>Math.abs(dy)) tc += dx>0?1:-1; else tr += dy>0?1:-1;
            if(tr>=0 && tr<ROWS && tc>=0 && tc<COLS) swap(touchStart.r, touchStart.c, tr, tc);
        }
        touchStart = null;
    });
</script>
</body>
</html>
